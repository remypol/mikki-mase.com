<svg xmlns="http://www.w3.org/2000/svg" width="400" height="533" viewBox="0 0 400 533">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#CFB53B"/>
      <stop offset="100%" stop-color="#E8D44D"/>
    </linearGradient>
    <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFB53B" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#CFB53B" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle gold glow -->
  <rect width="400" height="533" fill="url(#bg)"/>
  <rect width="400" height="533" fill="url(#goldFill)"/>
  <!-- Gold border (thicker for premium feel) -->
  <rect x="6" y="6" width="388" height="521" rx="10" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <!-- Inner border -->
  <rect x="14" y="14" width="372" height="505" rx="6" fill="none" stroke="#CFB53B" stroke-width="0.5" opacity="0.4"/>
  <!-- Top decorative line -->
  <line x1="50" y1="90" x2="350" y2="90" stroke="#CFB53B" stroke-width="1.5" opacity="0.5"/>
  <!-- Eyebrow -->
  <text x="200" y="75" text-anchor="middle" fill="#CFB53B" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" letter-spacing="3">MMC STRATEGY ARSENAL</text>
  <!-- Star icon -->
  <g transform="translate(200, 180)" opacity="0.9">
    <polygon points="0,-40 9,-13 38,-13 15,5 24,32 0,16 -24,32 -15,5 -38,-13 -9,-13" fill="#CFB53B" opacity="0.8"/>
  </g>
  <!-- Title -->
  <text x="200" y="270" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">Ultimate MMC</text>
  <text x="200" y="305" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700">Bundle</text>
  <!-- Subtitle -->
  <text x="200" y="345" text-anchor="middle" fill="#CFB53B" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="2">THE COMPLETE ARSENAL</text>
  <!-- Includes list -->
  <text x="200" y="380" text-anchor="middle" fill="#999999" font-family="system-ui, -apple-system, sans-serif" font-size="12">3 Cheat Sheets + 98-Page Ebook</text>
  <text x="200" y="400" text-anchor="middle" fill="#999999" font-family="system-ui, -apple-system, sans-serif" font-size="12">Everything in One Package</text>
  <!-- Bottom decorative line -->
  <line x1="50" y1="430" x2="350" y2="430" stroke="#CFB53B" stroke-width="1.5" opacity="0.5"/>
  <!-- Best value badge -->
  <rect x="130" y="450" width="140" height="28" rx="14" fill="none" stroke="#CFB53B" stroke-width="1"/>
  <text x="200" y="469" text-anchor="middle" fill="#CFB53B" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2">BEST VALUE</text>
</svg>